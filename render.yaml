services:
  - type: web
    name: email-agent
    env: python
    region: oregon
    plan: free
    buildCommand: pip install --upgrade pip && cd backend && pip install -r requirements-render.txt
    startCommand: cd backend && python -m uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
